# Unattended, read-only preflight and dry run for the 2026 Yahoo transaction
# recovery. Never applies anything. Procedure, setup and evidence:
# docs/recovery-preflight-automation.md.
#
# Disabled until the repository variable RECOVERY_PREFLIGHT_ENABLED is "true"
# (Settings > Secrets and variables > Actions > Variables). Without it every
# trigger, manual ones included, skips the job.
name: Recovery preflight (read-only)

on:
  schedule:
    # Starts before the 12:00 UTC Vercel cron and waits for it. The second
    # trigger is a backup for a dropped or late scheduled run; it skips if
    # today's evidence already exists, so a STOP is never retried.
    - cron: "41 11 * * *"
    - cron: "11 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to see whether today's evidence already exists

concurrency:
  group: recovery-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: vars.RECOVERY_PREFLIGHT_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Covers 11:41 to the 12:45 deadline, a 5-minute dry run and the validators.
    timeout-minutes: 80
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Name today's evidence
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Run at most once a day
        id: once
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: recovery-preflight-${{ steps.day.outputs.date }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=1" --jq .total_count)
          if [ "$count" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's preflight already ran (evidence artifact $NAME exists). Not running again." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the audited scripts
        if: steps.once.outputs.skip != 'true'
        working-directory: scripts/recovery
        run: sha256sum --check --strict SHA256SUMS

      - name: Preflight, then the dry run on GO (read-only)
        if: steps.once.outputs.skip != 'true'
        env:
          PREFLIGHT_DATABASE_URL: ${{ secrets.PREFLIGHT_DATABASE_URL }}
          RECOVERY_DRYRUN_TOKEN: ${{ secrets.RECOVERY_DRYRUN_TOKEN }}
        run: python3 -I scripts/recovery/preflight.py "evidence/${{ steps.day.outputs.date }}"

      - name: Publish the summary
        if: always() && steps.once.outputs.skip != 'true'
        env:
          DIR: evidence/${{ steps.day.outputs.date }}
        run: |
          # A run that ended before writing evidence is still today's one
          # attempt: record it as a STOP so the backup trigger doesn't retry.
          if [ ! -f "$DIR/summary.md" ]; then
            mkdir -p "$DIR"
            printf '# Recovery preflight: STOP\n\nThe run ended before the preflight wrote any evidence (see the job log). Nothing further runs today.\n' > "$DIR/summary.md"
          fi
          cat "$DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the evidence for 90 days
        if: always() && steps.once.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-preflight-${{ steps.day.outputs.date }}
          path: evidence/${{ steps.day.outputs.date }}/
          retention-days: 90
          if-no-files-found: error
