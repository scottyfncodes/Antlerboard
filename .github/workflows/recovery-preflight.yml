# Unattended, read-only preflight and dry run for the 2026 Yahoo transaction
# recovery. Never applies anything. Procedure, setup and evidence:
# docs/recovery-preflight-automation.md.
#
# Two modes:
# - preflight: the daily preflight and, on GO, the dry run. Production's
#   12:00 UTC Yahoo sync cron starts it (workflow_dispatch on the production
#   branch) as soon as the sync has finished; see
#   src/lib/recovery-preflight-dispatch.ts. Disabled until the repository
#   variable RECOVERY_PREFLIGHT_ENABLED is "true" (Settings > Secrets and
#   variables > Actions > Variables).
# - verify-setup (manual runs only): proves the Neon login, GitHub-to-Vercel
#   connectivity, the dry-run token and fail-closed behavior, and never runs
#   the dry run. It works while the schedule is disabled, so the setup can be
#   verified before it is enabled.
name: Recovery preflight (read-only)

on:
  schedule:
    # Not a way to make the window: GitHub started the runs due at 11:41 and
    # 12:11 on 2026-10-20 at 15:49 and 16:57. This is a missed-run alarm. It
    # skips when today's evidence exists; otherwise it records a STOP (it is
    # past the 13:55 latest start), so a day with no dispatch is never silent.
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "verify-setup (no dry run) or preflight (needs RECOVERY_PREFLIGHT_ENABLED)"
        type: choice
        options: [verify-setup, preflight]
        default: verify-setup

permissions:
  contents: read
  actions: read # to see whether today's evidence already exists

concurrency:
  group: recovery-preflight
  cancel-in-progress: false

jobs:
  preflight:
    # Schedules always run on the default (production) branch; a manual run
    # must be started from it too. The preflight mode needs the switch.
    if: >-
      (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) &&
      (inputs.mode == 'verify-setup' || vars.RECOVERY_PREFLIGHT_ENABLED == 'true')
    runs-on: ubuntu-24.04
    # Covers a manual start as early as 12:00 waiting up to the 13:55 latest
    # start, a 5.5-minute dry run and the validators.
    timeout-minutes: 130
    env:
      MODE: ${{ inputs.mode || 'preflight' }}
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Name the evidence
        id: day
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "verify-setup" ]; then
            echo "name=recovery-setup-check-$(date -u +%F)-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "name=recovery-preflight-$(date -u +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the preflight at most once a day
        id: once
        if: env.MODE == 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.day.outputs.name }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=1" --jq .total_count)
          if [ "$count" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's preflight already ran (evidence artifact $NAME exists). Not running again." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the audited scripts
        if: steps.once.outputs.skip != 'true'
        working-directory: scripts/recovery
        run: sha256sum --check --strict SHA256SUMS

      - name: Run (read-only)
        if: steps.once.outputs.skip != 'true'
        env:
          PREFLIGHT_DATABASE_URL: ${{ secrets.PREFLIGHT_DATABASE_URL }}
          RECOVERY_DRYRUN_TOKEN: ${{ secrets.RECOVERY_DRYRUN_TOKEN }}
          DIR: evidence/${{ steps.day.outputs.name }}
        run: |
          if [ "$MODE" = "verify-setup" ]; then
            python3 -I scripts/recovery/preflight.py --verify-setup "$DIR"
          else
            python3 -I scripts/recovery/preflight.py "$DIR"
          fi

      - name: Publish the summary
        if: always() && steps.once.outputs.skip != 'true'
        env:
          DIR: evidence/${{ steps.day.outputs.name }}
        run: |
          # A run that ended before writing evidence is still today's one
          # attempt: record it as a STOP so the backup trigger doesn't retry.
          if [ ! -f "$DIR/summary.md" ]; then
            mkdir -p "$DIR"
            printf '# Recovery preflight: STOP\n\nThe run ended before the preflight wrote any evidence (see the job log). Nothing further runs today.\n' > "$DIR/summary.md"
          fi
          cat "$DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the evidence for 90 days
        if: always() && steps.once.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.day.outputs.name }}
          path: evidence/${{ steps.day.outputs.name }}/
          retention-days: 90
          if-no-files-found: error
